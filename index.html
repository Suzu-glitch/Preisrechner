<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preisrechner</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="app">
      <div class="products-container">
        <h1>Preisrechner</h1>

        <div class="products-grid">
          <button class="item" onclick="addItemToOrder('Kaffee', 3.5)">
            <span class="item-name">Kaffee</span>
            <span class="item-price">3,50 €</span>
          </button>
          <button class="item" onclick="addItemToOrder('Tee', 2.5)">
            <span class="item-name">Tee</span>
            <span class="item-price">2,50 €</span>
          </button>
          <button class="item" onclick="addItemToOrder('Apfelschorle', 4.0)">
            <span class="item-name">Apfelschorle</span>
            <span class="item-price">4,00 €</span>
          </button>
          <button class="item" onclick="addItemToOrder('Wasser', 2.0)">
            <span class="item-name">Wasser</span>
            <span class="item-price">2,00 €</span>
          </button>

          <button class="item" onclick="addItemToOrder('Bratwurst', 5.5)">
            <span class="item-name">Bratwurst</span>
            <span class="item-price">5,50 €</span>
          </button>
          <button class="item" onclick="addItemToOrder('Schnitzel', 12.5)">
            <span class="item-name">Schnitzel</span>
            <span class="item-price">12,50 €</span>
          </button>
          <button class="item" onclick="addItemToOrder('Currywurst', 6.0)">
            <span class="item-name">Currywurst</span>
            <span class="item-price">6,00 €</span>
          </button>
          <button class="item" onclick="addItemToOrder('Brezel', 4.5)">
            <span class="item-name">Brezel</span>
            <span class="item-price">4,50 €</span>
          </button>

          <button class="item" onclick="addItemToOrder('Käsespätzle', 8.0)">
            <span class="item-name">Käsespätzle</span>
            <span class="item-price">8,00 €</span>
          </button>
          <button class="item" onclick="addItemToOrder('Pommes', 3.5)">
            <span class="item-name">Pommes</span>
            <span class="item-price">3,50 €</span>
          </button>
          <button class="item" onclick="addItemToOrder('Apfelstrudel', 4.5)">
            <span class="item-name">Apfelstrudel</span>
            <span class="item-price">4,50 €</span>
          </button>
          <button class="item" onclick="addItemToOrder('Berliner', 3.0)">
            <span class="item-name">Berliner</span>
            <span class="item-price">3,00 €</span>
          </button>

          <button class="item" onclick="addItemToOrder('Schwarzwälder', 5.0)">
            <span class="item-name">Schwarzwälder</span>
            <span class="item-price">5,00 €</span>
          </button>
          <button class="item" onclick="addItemToOrder('Brötchen', 2.5)">
            <span class="item-name">Brötchen</span>
            <span class="item-price">2,50 €</span>
          </button>
          <button class="item" onclick="addItemToOrder('Leberkäse', 7.0)">
            <span class="item-name">Leberkäse</span>
            <span class="item-price">7,00 €</span>
          </button>
          <button class="item" onclick="addItemToOrder('Kartoffelsalat', 6.5)">
            <span class="item-name">Kartoffelsalat</span>
            <span class="item-price">6,50 €</span>
          </button>
        </div>

        <hr />

        <div class="total-row">
          <span class="total-label">Gesamt</span>
          <span class="total-value">0,00 €</span>
        </div>

        <div class="reset-buttons">
          <button class="btn-undo" id="undo" onclick="undoLastItem()">
            Rückgängig
          </button>
          <button class="btn-clear-all" id="reset" onclick="resetOrder()">
            Alles löschen
          </button>
        </div>

        <div class="order-type-buttons">
          <button class="btn-in-house" id="inhouse" onclick="checkoutInHouse()">
            Vor Ort
          </button>
          <button
            class="btn-delivery"
            id="delivery"
            onclick="checkoutDelivery()"
          >
            Lieferung
          </button>
        </div>
      </div>

      <div class="order-container">
        <h2>Bestellung</h2>
        <div class="order-list"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
