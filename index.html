<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preisrechner</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="app">
      <div class="produkte-container">
        <h1>Preisrechner</h1>

        <div class="produkte-grid">
          <button class="artikel" onclick="artikelHinzufuegen('Kaffee', 3.5)">
            <span class="artikel-name">Kaffee</span>
            <span class="artikel-preis">3,50 €</span>
          </button>
          <button class="artikel" onclick="artikelHinzufuegen('Tee', 2.5)">
            <span class="artikel-name">Tee</span>
            <span class="artikel-preis">2,50 €</span>
          </button>
          <button
            class="artikel"
            onclick="artikelHinzufuegen('Apfelschorle', 4.0)"
          >
            <span class="artikel-name">Apfelschorle</span>
            <span class="artikel-preis">4,00 €</span>
          </button>
          <button class="artikel" onclick="artikelHinzufuegen('Wasser', 2.0)">
            <span class="artikel-name">Wasser</span>
            <span class="artikel-preis">2,00 €</span>
          </button>

          <button
            class="artikel"
            onclick="artikelHinzufuegen('Bratwurst', 5.5)"
          >
            <span class="artikel-name">Bratwurst</span>
            <span class="artikel-preis">5,50 €</span>
          </button>
          <button
            class="artikel"
            onclick="artikelHinzufuegen('Schnitzel', 12.5)"
          >
            <span class="artikel-name">Schnitzel</span>
            <span class="artikel-preis">12,50 €</span>
          </button>
          <button
            class="artikel"
            onclick="artikelHinzufuegen('Currywurst', 6.0)"
          >
            <span class="artikel-name">Currywurst</span>
            <span class="artikel-preis">6,00 €</span>
          </button>
          <button class="artikel" onclick="artikelHinzufuegen('Brezel', 4.5)">
            <span class="artikel-name">Brezel</span>
            <span class="artikel-preis">4,50 €</span>
          </button>

          <button
            class="artikel"
            onclick="artikelHinzufuegen('Käsespätzle', 8.0)"
          >
            <span class="artikel-name">Käsespätzle</span>
            <span class="artikel-preis">8,00 €</span>
          </button>
          <button class="artikel" onclick="artikelHinzufuegen('Pommes', 3.5)">
            <span class="artikel-name">Pommes</span>
            <span class="artikel-preis">3,50 €</span>
          </button>
          <button
            class="artikel"
            onclick="artikelHinzufuegen('Apfelstrudel', 4.5)"
          >
            <span class="artikel-name">Apfelstrudel</span>
            <span class="artikel-preis">4,50 €</span>
          </button>
          <button class="artikel" onclick="artikelHinzufuegen('Berliner', 3.0)">
            <span class="artikel-name">Berliner</span>
            <span class="artikel-preis">3,00 €</span>
          </button>

          <button
            class="artikel"
            onclick="artikelHinzufuegen('Schwarzwälder', 5.0)"
          >
            <span class="artikel-name">Schwarzwälder</span>
            <span class="artikel-preis">5,00 €</span>
          </button>
          <button class="artikel" onclick="artikelHinzufuegen('Brötchen', 2.5)">
            <span class="artikel-name">Brötchen</span>
            <span class="artikel-preis">2,50 €</span>
          </button>
          <button
            class="artikel"
            onclick="artikelHinzufuegen('Leberkäse', 7.0)"
          >
            <span class="artikel-name">Leberkäse</span>
            <span class="artikel-preis">7,00 €</span>
          </button>
          <button
            class="artikel"
            onclick="artikelHinzufuegen('Kartoffelsalat', 6.5)"
          >
            <span class="artikel-name">Kartoffelsalat</span>
            <span class="artikel-preis">6,50 €</span>
          </button>
        </div>

        <hr />

        <div class="gesamt-zeile">
          <span class="gesamt-label">Gesamt</span>
          <span class="gesamt-wert">0,00 €</span>
        </div>

        <div class="reset-buttons">
          <button class="btn-rueckgaengig" id="undo">Rückgängig</button>
          <button class="btn-alles-loeschen" id="reset">Alles löschen</button>
        </div>

        <div class="bestellart-buttons">
          <button class="btn-vor-ort" id="inhouse">Vor Ort</button>
          <button class="btn-lieferung" id="delivery">Lieferung</button>
        </div>
      </div>

      <div class="bestellung-container">
        <h2>Bestellung</h2>
        <div class="bestellung-liste"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
